<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="260" viewBox="0 0 1540 260"><rect width="1540" height="260" rx="20" fill="#f4f8fa"/><text x="32" y="43" fill="#1d3e4e" font-family="Arial" font-size="26" font-weight="bold">From a clinical measurement table to an evaluated classifier</text><rect x="25" y="78" width="238" height="120" rx="16" fill="#d5ebf7"/><text x="44" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#254257">1. Scope</text><text x="44" y="150" font-family="Arial" font-size="16" fill="#597280">B versus M</text><rect x="280" y="78" width="238" height="120" rx="16" fill="#ddf2ed"/><text x="299" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#254257">2. Acquire</text><text x="299" y="150" font-family="Arial" font-size="16" fill="#597280">MDC course CSV</text><rect x="535" y="78" width="238" height="120" rx="16" fill="#e5ebf9"/><text x="554" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#254257">3. Explore</text><text x="554" y="150" font-family="Arial" font-size="16" fill="#597280">Missing data</text><rect x="790" y="78" width="238" height="120" rx="16" fill="#ddf2ed"/><text x="809" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#254257">4. Model</text><text x="809" y="150" font-family="Arial" font-size="16" fill="#597280">KNN, SVM, Tree</text><rect x="1045" y="78" width="238" height="120" rx="16" fill="#fae9d9"/><text x="1064" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#254257">5. Evaluate</text><text x="1064" y="150" font-family="Arial" font-size="16" fill="#597280">Errors and recall</text><rect x="1300" y="78" width="238" height="120" rx="16" fill="#d5ebf7"/><text x="1319" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#254257">6. Deploy</text><text x="1319" y="150" font-family="Arial" font-size="16" fill="#597280">Proposed, not live</text></svg>
